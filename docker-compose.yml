version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: top-api.mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_LOGIN}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - '27017:27017'
    volumes:
      - ./mongo-data:/data/db
    command: --wiredTigerCacheSizeGB 1.5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: top-api.app
    restart: always
    depends_on:
      - mongo
    env_file:
      - .env
    ports:
      - '3000:3000'
